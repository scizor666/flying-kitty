<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#7dbfee" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Flying Kitty: Find Cloudy</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #7dbfee;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        background: rgba(20, 40, 70, 0.55);
        color: #fff;
        text-align: center;
        font-family: 'Trebuchet MS', 'Comic Sans MS', sans-serif;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      }
      .overlay.hidden {
        display: none;
      }
      .overlay h1 {
        color: #ffe066;
        font-size: clamp(28px, 5vw, 52px);
        margin: 0;
      }
      .overlay p {
        font-size: clamp(16px, 2.2vw, 26px);
        margin: 0;
      }
      .overlay .accent {
        color: #ffe066;
        font-size: clamp(22px, 3.4vw, 40px);
      }
      .overlay button {
        font: inherit;
        font-size: 24px;
        color: #fff;
        background: #ff7eb6;
        border: 0;
        border-radius: 16px;
        padding: 14px 44px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      }
      .overlay button:active {
        transform: scale(0.97);
      }
      #player-name {
        font: inherit;
        font-size: 22px;
        text-align: center;
        padding: 8px 14px;
        border: 0;
        border-radius: 12px;
        outline: none;
        width: min(60vw, 280px);
        color: #223344;
        text-shadow: none;
      }
      #over-stats {
        white-space: pre-line;
      }
      #records {
        font-size: clamp(14px, 2vw, 20px);
        line-height: 1.5;
        width: min(80vw, 440px);
      }
      #records h2 {
        color: #ffe066;
        font-size: clamp(18px, 2.6vw, 26px);
        margin: 0 0 4px;
      }
      #records table {
        width: 100%;
        border-collapse: collapse;
      }
      #records td {
        padding: 0 10px;
      }
      #records td.rank {
        text-align: right;
        width: 2.5em;
      }
      #records td.name {
        text-align: left;
      }
      #records td.score,
      #records td.time {
        text-align: right;
      }
      #records td.time {
        color: #cfe3ff;
      }
      #records tr.current {
        color: #ffe066;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="overlay-start" class="overlay">
      <h1>Flying Kitty: Find Cloudy! ☁️</h1>
      <p>Cloudy is hiding behind one of <span id="cloud-count">?</span> clouds.</p>
      <p>Fly with arrow keys / WASD (or drag on a tablet).</p>
      <p>Get close to a cloud, then press SPACE or tap it to peek!</p>
      <p>Who is playing?</p>
      <input id="player-name" maxlength="20" placeholder="Kitty" autocomplete="off" />
      <p class="accent">Press SPACE to Start</p>
      <button id="start-btn" type="button">▶&nbsp; Start</button>
    </div>
    <div id="overlay-over" class="overlay hidden">
      <h1 id="over-title"></h1>
      <p id="over-stats"></p>
      <div id="records"></div>
      <button id="replay-btn" type="button">↻&nbsp; Play Again</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
